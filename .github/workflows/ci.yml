name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated API contract
        run: |
          go run ./cmd/contractgen
          git diff --exit-code -- \
            internal/api/contract_generated.go \
            ios/Planty/Networking/APIContract.generated.swift

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race ./...

  # The image packages GoReleaser's dist binary rather than running go build.
  # Exercise that handoff on every change so a dist-layout or Dockerfile change
  # fails before the release workflow sees it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GoReleaser assets
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image from dist
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ios:
    runs-on: [self-hosted, macOS, ARM64, mini-2, release, planty]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: xcodebuild -version

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme Planty \
            -destination 'platform=iOS Simulator,name=iPhone 17'

  # Unit tests and the compiler both accepted a digest query that Postgres
  # rejected outright, so the schema and every query run against a real server.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: planty
          POSTGRES_DB: planty
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply migrations
        env:
          PLANTY_DATABASE_URL: postgres://postgres:planty@localhost:5432/planty?sslmode=disable
        run: go run ./cmd/planty migrate

      - name: Seed, proving the shipped data still validates
        env:
          PLANTY_DATABASE_URL: postgres://postgres:planty@localhost:5432/planty?sslmode=disable
        run: go run ./cmd/planty seed

      - name: Store integration tests
        env:
          PLANTY_TEST_DATABASE_URL: postgres://postgres:planty@localhost:5432/planty?sslmode=disable
        run: go test -race ./internal/store/...
