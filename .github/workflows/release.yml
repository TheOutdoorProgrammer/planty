name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build and sign, publish nothing, cut no tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Keep main useful between releases. The Dockerfile consumes GoReleaser's
  # dist tree, so snapshots build that tree first rather than compiling Go a
  # second time inside Docker.
  snapshot:
    name: Backend snapshot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GoReleaser assets
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            # deploy/*.yaml reference :latest, so main snapshots keep it fresh.
            type=raw,value=latest,enable={{is_default_branch}}

      # arm64 matters here: the cluster is Mac minis.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ios:
    name: iOS archive
    if: github.event_name == 'workflow_dispatch'
    # Xcode 26 is the default here, which the iOS 26 deployment target needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain
        run: xcodebuild -version

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme Planty \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      # Automatic signing needs an account, and a runner has no Xcode session
      # to borrow one from, so it authenticates with an App Store Connect key.
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive and export
        working-directory: ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PLANTY_BASE_URL: ${{ secrets.PLANTY_BASE_URL }}
          FLEDGE_BASE_URL: ${{ secrets.FLEDGE_URL }}
          # Monotonic and never reused, which is all a build number owes anyone.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )

          # The build number comes from the run, not the project file. Hand
          # editing it meant a release could ship a build indistinguishable
          # from the one before it, which is what happened: fledge listed two
          # different builds as 1.0 (5) and the update check offered neither.
          xcodebuild archive \
            -scheme Planty \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -destination 'generic/platform=iOS' \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PLANTY_BASE_URL="$PLANTY_BASE_URL" \
            FLEDGE_BASE_URL="$FLEDGE_BASE_URL"

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            "${auth[@]}"

          ls -la "$RUNNER_TEMP/export"

      # Only Xcode stays on macOS. Quill hands the signed archive to its Linux
      # release job, where GoReleaser, Fledge and Docker share one transaction.
      - id: stage
        uses: TheOutdoorProgrammer/quill/stage@v1
        with:
          name: planty-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/export/Planty.ipa

    outputs:
      artifact-name: ${{ steps.stage.outputs.artifact-name }}

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    needs: ios
    uses: TheOutdoorProgrammer/quill/.github/workflows/staged-release.yml@v1
    with:
      artifact-name: ${{ needs.ios.outputs.artifact-name }}
      fledge-ipa: Planty.ipa
      bump: ${{ inputs.bump }}
      scope: ${{ inputs.scope }}
      dry-run: ${{ inputs.dry-run }}
      # GoReleaser produces dist/, then Docker packages that exact binary.
      publish: goreleaser,fledge,docker
      docker-platforms: linux/amd64,linux/arm64
    secrets:
      fledge-server: ${{ secrets.FLEDGE_URL }}
      tap-app-id: ${{ secrets.TAP_APP_ID }}
      tap-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      packages: write
      # Fledge authenticates with a workload identity token, so no upload
      # token is stored in this repository.
      id-token: write
