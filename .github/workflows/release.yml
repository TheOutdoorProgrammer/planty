name: Backend image

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Semver tag produced by the release orchestrator
        type: string
        required: true
      prerelease:
        description: Do not move latest for a release candidate
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,format=long
            # deploy/*.yaml reference :latest, so it has to exist or anyone
            # following the README gets ImagePullBackOff. Release candidates
            # must not replace the latest stable image.
            type=raw,value=latest,enable=${{ (inputs.version == '' && github.ref == 'refs/heads/main') || (inputs.version != '' && !inputs.prerelease) }}

      # arm64 matters here: the cluster is Mac minis.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.version != '' && inputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
