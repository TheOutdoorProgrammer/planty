name: Release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build and sign, publish nothing, cut no tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS archive
    # Xcode 26 is the default here, which the iOS 26 deployment target needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain
        run: xcodebuild -version

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme Planty \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Persistent Apple signing
        id: signing
        uses: TheOutdoorProgrammer/quill/apple-signing@1eb90455ea34ced58e5377dc0058cc6e50e297b0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}
          bundle-identifiers: zone.stout.Planty

      - name: Archive and export
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PLANTY_BASE_URL: ${{ secrets.PLANTY_BASE_URL }}
          PLANTY_API_TOKEN: ${{ secrets.PLANTY_API_TOKEN }}
          FLEDGE_BASE_URL: ${{ secrets.FLEDGE_URL }}
          # Monotonic and never reused, which is all a build number owes anyone.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          : "${PLANTY_API_TOKEN:?PLANTY_API_TOKEN must be configured before releasing}"

          # The build number comes from the run, not the project file. Hand
          # editing it meant a release could ship a build indistinguishable
          # from the one before it, which is what happened: fledge listed two
          # different builds as 1.0 (5) and the update check offered neither.
          xcodebuild archive \
            -scheme Planty \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_ENTITLEMENTS="Planty/Planty.entitlements" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PLANTY_BASE_URL="$PLANTY_BASE_URL" \
            PLANTY_API_TOKEN="$PLANTY_API_TOKEN" \
            FLEDGE_BASE_URL="$FLEDGE_BASE_URL"

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>zone.stout.Planty</key><string>$PROFILE_NAME</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"

          app_dir="$RUNNER_TEMP/exported-app"
          entitlements="$RUNNER_TEMP/Planty.entitlements.plist"
          profile="$RUNNER_TEMP/Planty.profile.plist"
          ditto -x -k "$RUNNER_TEMP/export/Planty.ipa" "$app_dir"
          codesign --verify --deep --strict "$app_dir/Payload/Planty.app"
          codesign -d --entitlements :- "$app_dir/Payload/Planty.app" \
            > "$entitlements" 2>/dev/null
          security cms -D -i "$app_dir/Payload/Planty.app/embedded.mobileprovision" \
            > "$profile"
          test "$(plutil -extract aps-environment raw -o - "$entitlements")" = production
          test "$(plutil -extract UUID raw -o - "$profile")" = "$PROFILE_UUID"
          test "$(plutil -extract Entitlements.application-identifier raw -o - "$profile")" = "$TEAM.zone.stout.Planty"
          test "$(plutil -extract Entitlements.aps-environment raw -o - "$profile")" = production
          test "$(plutil -extract Entitlements.get-task-allow raw -o - "$profile")" = false

      # Only Xcode stays on macOS. Quill hands the signed archive to its Linux
      # release job, where GoReleaser, Fledge and Docker share one transaction.
      - id: stage
        uses: TheOutdoorProgrammer/quill/stage@v1
        with:
          name: planty-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/export/Planty.ipa

    outputs:
      artifact-name: ${{ steps.stage.outputs.artifact-name }}

  release:
    name: Release
    needs: ios
    uses: TheOutdoorProgrammer/quill/.github/workflows/staged-release.yml@v1
    with:
      artifact-name: ${{ needs.ios.outputs.artifact-name }}
      fledge-ipa: Planty.ipa
      bump: ${{ inputs.bump }}
      scope: ${{ inputs.scope }}
      dry-run: ${{ inputs.dry-run }}
      fledge-fail-on-development-signing: true
      # GoReleaser produces dist/, then Docker packages that exact binary.
      publish: goreleaser,fledge,docker
      docker-platforms: linux/amd64,linux/arm64
    secrets:
      fledge-server: ${{ secrets.FLEDGE_URL }}
      tap-app-id: ${{ secrets.TAP_APP_ID }}
      tap-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      packages: write
      # Fledge authenticates with a workload identity token, so no upload
      # token is stored in this repository.
      id-token: write
