name: iOS release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build and sign, publish nothing, cut no tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    # Xcode 26 is the default here, which the iOS 26 deployment target needs.
    runs-on: macos-26
    permissions:
      contents: write
      # Publishing with a workload identity token, so no upload token is
      # stored in this repository at all.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Not optional: quill reads the tag list to work out the next version
          # and refuses a shallow checkout rather than restarting from zero.
          fetch-depth: 0

      - name: Toolchain
        run: xcodebuild -version

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme Planty \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      # Automatic signing needs an account, and a runner has no Xcode session
      # to borrow one from, so it authenticates with an App Store Connect key.
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive and export
        working-directory: ios
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PLANTY_BASE_URL: ${{ secrets.PLANTY_BASE_URL }}
          FLEDGE_BASE_URL: ${{ secrets.FLEDGE_URL }}
        run: |
          set -euo pipefail
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )

          xcodebuild archive \
            -scheme Planty \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -destination 'generic/platform=iOS' \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM" \
            PLANTY_BASE_URL="$PLANTY_BASE_URL" \
            FLEDGE_BASE_URL="$FLEDGE_BASE_URL"

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Planty.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            "${auth[@]}"

          ls -la "$RUNNER_TEMP/export"

      - uses: TheOutdoorProgrammer/quill@v1
        id: release
        with:
          bump: ${{ inputs.bump }}
          scope: ${{ inputs.scope }}
          dry-run: ${{ inputs.dry-run }}
          publish: fledge
          fledge-server: ${{ secrets.FLEDGE_URL }}
          # Checked before the tag is cut, so a missing archive does not burn
          # the version. Named, never globbed: this path is opened verbatim,
          # and `*.ipa` is simply a filename that does not exist.
          fledge-ipa: ${{ runner.temp }}/export/Planty.ipa

      - name: Where it landed
        if: steps.release.outputs.page-url != ''
        run: |
          echo "Install page: ${{ steps.release.outputs.page-url }}" >> "$GITHUB_STEP_SUMMARY"
