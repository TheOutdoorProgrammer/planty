apiVersion: v1
kind: ConfigMap
metadata:
  name: planty-config
  namespace: planty
data:
  PLANTY_ADDR: ":8080"
  # Browser writes are same-origin only. Private/loopback IP hosts work without
  # configuration; list any LAN DNS names used from a browser here, comma-separated.
  # Native iOS/CLI clients send no Origin header and are unaffected.
  PLANTY_ALLOWED_BROWSER_HOSTS: ""

  # Your Home Assistant base URL. Set per deployment; this repository is public.
  PLANTY_HA_URL: ""
  PLANTY_WEATHER_ENTITY: "weather.nws_home"

  PLANTY_JUDGE: "codex"
  PLANTY_JUDGE_MODEL: "gpt-6-astra"
  PLANTY_CODEX_HOME: "/codex"
  PLANTY_FRIEND_NAME: "friend"

  # Only the owner's Codex subscription is offered for model assignments.
  PLANTY_PROVIDERS: |
    [
      {"id": "codex", "kind": "codex"}
    ]

  # Object storage for photos. Leave the endpoint empty to disable the photo
  # routes rather than failing the whole service.
  PLANTY_S3_ENDPOINT: ""
  PLANTY_S3_BUCKET: "planty"
  PLANTY_S3_SSL: "false"

  # The same bucket under the name the phone can reach. Photo links are signed
  # for this host, so unset hands the app a cluster URL it cannot resolve.
  # Set per deployment; this repository is public.
  PLANTY_S3_PUBLIC_ENDPOINT: ""
  PLANTY_S3_PUBLIC_SSL: "true"

  # The LetPot pump, once the HSTEP component is installed. `planty water`
  # refuses to run without PLANTY_PUMP_SWITCH set.
  PLANTY_PUMP_SWITCH: ""
  PLANTY_PUMP_SENSOR: ""
  PLANTY_PUMP_SECONDS: "120"
