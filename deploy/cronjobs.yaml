                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# The LetPot line. Hourly clears the 45 minute settle window, so a run never
# judges soil that has not finished drinking and water it twice. Waking hours
# only: a mixed line asks somebody to move a dripper, and a 3am ask is ignored.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-water
  namespace: planty
spec:
  schedule: "0 7-21 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: water
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["water"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# Cold snap watch. Mid-afternoon: late enough that tonight's forecast has
# settled, early enough that there is daylight left to carry pots indoors.
# Firing at the moment it turns cold would be a postmortem, not a warning.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-cold
  namespace: planty
spec:
  schedule: "0 15 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: cold
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["cold"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
