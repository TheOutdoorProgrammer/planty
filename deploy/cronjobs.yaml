---
# Sensor ingest. Frequent enough to catch a pot drying out, rare enough that the
# Zigbee sensors' own reporting interval stays the limiting factor.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-ingest
  namespace: planty
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: ingest
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["ingest"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# The daily verdict and digest. Morning, so a "water this" lands when there is a
# whole day left to act on it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-daily
  namespace: planty
spec:
  schedule: "0 8 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
