---
# What the probes say, and nothing else. Named `thirst` rather than `water`
# because it moves no water: Planty reports and Joey decides.
# Twice a day, morning and evening, which is when somebody would go and look.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-thirst
  namespace: planty
spec:
  schedule: "0 9,18 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: thirst
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["thirst"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# Cold snap watch. Mid-afternoon: late enough that tonight's forecast has
# settled, early enough that there is daylight left to carry pots indoors.
# Firing at the moment it turns cold would be a postmortem, not a warning.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-cold
  namespace: planty
spec:
  schedule: "0 15 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: cold
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["cold"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# The chores nothing else notices. Hourly because a mushroom kit misted at eight
# and again at eight is two separate reminders, and a daily job sends only one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-remind
  namespace: planty
spec:
  schedule: "0 * * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: remind
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["remind"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
