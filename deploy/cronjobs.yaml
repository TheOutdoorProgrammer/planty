---
# Sensor ingest. Frequent enough to catch a pot drying out, rare enough that the
# Zigbee sensors' own reporting interval stays the limiting factor.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-ingest
  namespace: planty
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: ingest
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["ingest"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# The daily verdict and digest. Morning, so a "water this" lands when there is a
# whole day left to act on it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-daily
  namespace: planty
spec:
  schedule: "0 8 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: daily
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["daily"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              # This is the one scheduled job that asks the model anything, so
              # it is the one that needs somewhere for the CLI to write.
              volumeMounts:
                - name: claude-home
                  mountPath: /home/planty
                - name: scratch
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                limits:
                  memory: 1Gi
          volumes:
            # Bounded so a runaway job is evicted rather than filling the node.
            - name: claude-home
              emptyDir:
                sizeLimit: 1Gi
            - name: scratch
              emptyDir:
                sizeLimit: 1Gi
---
# Chase unacknowledged verdicts. Waking hours only; the ladder caps at three.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-chase
  namespace: planty
spec:
  schedule: "0 13,20 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: chase
              image: ghcr.io/theoutdoorprogrammer/planty:latest
              args: ["chase"]
              envFrom:
                - configMapRef:
                    name: planty-config
                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# Away mode. Runs after the daily digest so a return briefing lands with the
# morning's verdicts already computed rather than a day behind.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-away
  namespace: planty
spec:
  schedule: "30 8 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
