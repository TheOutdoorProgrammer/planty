                - secretRef:
                    name: planty-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# Away mode. Runs after the daily digest so a return briefing lands with the
# morning's verdicts already computed rather than a day behind.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planty-away
  namespace: planty
spec:
  schedule: "30 8 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
