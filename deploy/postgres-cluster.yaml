apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: planty-postgres
  namespace: planty
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "100"
  bootstrap:
    initdb:
      database: planty
      owner: planty
      secret:
        name: planty-secrets
