apiVersion: apps/v1
kind: Deployment
metadata:
  name: planty
  namespace: planty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planty
      app.kubernetes.io/instance: planty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planty
        app.kubernetes.io/instance: planty
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planty
          image: ghcr.io/theoutdoorprogrammer/planty:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: planty-config
            - secretRef:
                name: planty-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: planty
  namespace: planty
spec:
  selector:
    app.kubernetes.io/name: planty
    app.kubernetes.io/instance: planty
  ports:
    - name: http
      port: 8080
      targetPort: http
