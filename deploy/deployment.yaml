apiVersion: v1
kind: ServiceAccount
metadata:
  name: planty-api
  namespace: planty
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: planty-scheduled-jobs
  namespace: planty
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: planty-scheduled-jobs
  namespace: planty
subjects:
  - kind: ServiceAccount
    name: planty-api
    namespace: planty
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: planty-scheduled-jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planty
  namespace: planty
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planty
      app.kubernetes.io/instance: planty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planty
        app.kubernetes.io/instance: planty
    spec:
      serviceAccountName: planty-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planty
          image: ghcr.io/theoutdoorprogrammer/planty:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: planty-config
            - secretRef:
                name: planty-secrets
          volumeMounts:
            - name: runtime-home
              mountPath: /home/planty
            - name: codex-home
              mountPath: /codex
            - name: scratch
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # The CLI is a separate process with its own heap, and it is the
              # thing that decides this number rather than the Go service.
              memory: 1Gi
      volumes:
        - name: runtime-home
          emptyDir:
            sizeLimit: 2Gi
        # OAuth refreshes must survive pod replacement and be shared with daily.
        - name: codex-home
          persistentVolumeClaim:
            claimName: planty-codex
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: planty
  namespace: planty
spec:
  selector:
    app.kubernetes.io/name: planty
    app.kubernetes.io/instance: planty
  ports:
    - name: http
      port: 8080
      targetPort: http
