<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Planty project mark</title>
  <desc id="desc">A delighted pink starfish proudly holds a crooked pot containing two lively leaves and one visibly drooping leaf.</desc>

  <!-- A pale outer keyline keeps the silhouette crisp on Dracula-dark backgrounds. -->
  <path
    d="M128 15 C146 15 148 54 151 73 C166 59 190 40 203 51 C216 62 190 91 179 103 C198 107 228 115 228 132 C228 149 194 153 175 152 C184 174 201 208 186 219 C170 231 145 195 128 177 C111 197 89 229 73 218 C57 207 72 174 81 153 C60 156 26 154 23 138 C20 121 53 111 78 104 C66 91 44 66 55 52 C67 38 93 58 106 72 C110 52 112 15 128 15 Z"
    fill="#ff79c6"
    stroke="#f8f8f2"
    stroke-width="13"
    stroke-linejoin="round"/>

  <!-- The dark inner outline reads on white and carries the small-size drawing. -->
  <path
    d="M128 15 C146 15 148 54 151 73 C166 59 190 40 203 51 C216 62 190 91 179 103 C198 107 228 115 228 132 C228 149 194 153 175 152 C184 174 201 208 186 219 C170 231 145 195 128 177 C111 197 89 229 73 218 C57 207 72 174 81 153 C60 156 26 154 23 138 C20 121 53 111 78 104 C66 91 44 66 55 52 C67 38 93 58 106 72 C110 52 112 15 128 15 Z"
    fill="#ff79c6"
    stroke="#282a36"
    stroke-width="7"
    stroke-linejoin="round"/>

  <!-- Uneven eyes and a crooked grin make the confidence-to-competence ratio clear. -->
  <ellipse cx="115" cy="76" rx="12" ry="15" fill="#f8f8f2" stroke="#282a36" stroke-width="5"/>
  <ellipse cx="143" cy="80" rx="9" ry="12" fill="#f8f8f2" stroke="#282a36" stroke-width="5"/>
  <circle cx="118" cy="82" r="4.5" fill="#282a36"/>
  <circle cx="141" cy="84" r="3.5" fill="#282a36"/>
  <path d="M103 101 C114 119 143 122 156 103 C154 130 112 135 103 101 Z" fill="#282a36"/>
  <path d="M124 112 L137 113 L134 123 C130 125 126 123 124 112 Z" fill="#f8f8f2"/>
  <path d="M116 127 C126 120 140 122 147 127 C138 133 124 134 116 127 Z" fill="#ff79c6"/>

  <!-- The pot is tipped just enough to be obviously wrong, but still readable at favicon scale. -->
  <g transform="rotate(11 135 154)">
    <path d="M100 139 H171 L162 187 Q160 195 152 195 H119 Q111 195 109 187 Z" fill="#ffb86c" stroke="#282a36" stroke-width="7" stroke-linejoin="round"/>
    <path d="M96 134 Q96 129 102 129 H169 Q175 129 175 134 V145 H96 Z" fill="#f1fa8c" stroke="#282a36" stroke-width="7" stroke-linejoin="round"/>
    <path d="M105 134 H166" fill="none" stroke="#282a36" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Two arm creases put the pot in the starfish's grasp instead of floating on its chest. -->
  <path d="M77 146 C87 138 94 140 101 151" fill="none" stroke="#282a36" stroke-width="7" stroke-linecap="round"/>
  <path d="M177 144 C168 139 163 143 159 153" fill="none" stroke="#282a36" stroke-width="7" stroke-linecap="round"/>

  <!-- The larger plant is a co-star: two lively leaves and one leaf that has seen enough. -->
  <path d="M149 136 C146 116 151 96 166 79 M156 102 C147 94 139 89 132 86 M164 91 C176 91 187 95 196 105 M170 99 C189 105 202 119 204 137" fill="none" stroke="#282a36" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 80 C174 61 195 59 207 68 C197 87 178 94 165 80 Z" fill="#50fa7b" stroke="#282a36" stroke-width="6" stroke-linejoin="round"/>
  <path d="M155 101 C143 103 130 96 125 84 C140 75 155 83 155 101 Z" fill="#50fa7b" stroke="#282a36" stroke-width="6" stroke-linejoin="round"/>
  <path d="M203 135 C216 133 227 143 224 156 C209 163 197 151 203 135 Z" fill="#f1fa8c" stroke="#282a36" stroke-width="6" stroke-linejoin="round"/>
</svg>
